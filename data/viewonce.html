<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Visualização única</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #media-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      overflow: hidden;
    }
    img, video {
      max-width: 100%;
      max-height: calc(100vh - 48px);
      object-fit: contain;
      display: block;
    }
    .toolbar {
      width: 100%;
      height: 48px;
      background: rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .btn {
      padding: 7px 18px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      background: rgba(255,255,255,0.12);
      color: #fff;
      transition: background 0.15s;
    }
    .btn:hover { background: rgba(255,255,255,0.22); }
    .btn-save { background: #00a884; }
    .btn-save:hover { background: #02c79a; }
    #loading {
      color: #888;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="media-container">
    <div id="loading">Carregando...</div>
  </div>
  <div class="toolbar">
    <button class="btn btn-save" id="btn-save">⬇ Salvar</button>
    <button class="btn" id="btn-close">✕ Fechar</button>
  </div>

  <script>
    var currentDataUrl = null;
    var currentType = null;

    window.viewOnceAPI.onData(function(data) {
      currentDataUrl = data.dataUrl;
      currentType = data.type;
      var container = document.getElementById('media-container');

      if (data.type === 'video') {
        var vid = document.createElement('video');
        vid.src = data.dataUrl;
        vid.controls = true;
        vid.autoplay = true;
        container.innerHTML = '';
        container.appendChild(vid);
      } else {
        var img = document.createElement('img');
        img.src = data.dataUrl;
        container.innerHTML = '';
        container.appendChild(img);
      }
    });

    document.getElementById('btn-save').onclick = function() {
      if (!currentDataUrl) return;
      var ext = currentType === 'video' ? 'mp4' : 'jpg';
      var a = document.createElement('a');
      a.href = currentDataUrl;
      a.download = 'WhatsApp-ViewOnce-' + Date.now() + '.' + ext;
      a.click();
    };

    document.getElementById('btn-close').onclick = function() {
      window.close();
    };
  </script>
</body>
</html>
